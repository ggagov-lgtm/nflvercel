name: Test Week 3 Tuesday Lifecycle

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Verify Week 2 settlement state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          PYTHONPATH=python python - <<'PY'
          import os

          from supabase import create_client
          from src.espn import scoreboard, parse_games
          from src.settlement import settle_week

          season = 2026
          week = 2

          db = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SECRET_KEY"],
          )

          games = parse_games(
              scoreboard(season, week)
          )

          result = settle_week(
              db=db,
              season=season,
              week=week,
              games=games,
              dry_run=True,
          )

          print()
          print("WEEK 2 SETTLEMENT CHECK:")
          print(result)

          assert result["status"] == "NO_PREDICTIONS"
          assert result["games"] == 0

          print()
          print("WEEK 2 HISTORY SAFETY CHECK: PASS")
          PY

      - name: Run Week 3 full model dry run
        run: |
          PYTHONPATH=python python python/weekly_run.py \
            --season 2026 \
            --week 3 \
            --dry-run
