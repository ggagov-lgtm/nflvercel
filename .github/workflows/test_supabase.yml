name: Test Supabase Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Safe Supabase diagnostic
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error

          url = os.environ.get("SUPABASE_URL", "").strip()
          key = os.environ.get("SUPABASE_SECRET_KEY", "").strip()

          print("=" * 60)
          print("SUPABASE CONNECTION DIAGNOSTIC")
          print("=" * 60)

          print("URL configured:", bool(url))
          print("Key configured:", bool(key))
          print("URL starts https://:", url.startswith("https://"))
          print("URL ends supabase.co:", url.rstrip("/").endswith("supabase.co"))

          if key.startswith("sb_secret_"):
              key_type = "sb_secret"
          elif key.startswith("eyJ"):
              key_type = "legacy JWT"
          else:
              key_type = "UNKNOWN"

          print("Key type:", key_type)
          print("Key length:", len(key))

          if not url:
              raise SystemExit("FAIL: SUPABASE_URL is empty")

          if not key:
              raise SystemExit("FAIL: SUPABASE_SECRET_KEY is empty")

          endpoint = url.rstrip("/") + "/rest/v1/"

          req = urllib.request.Request(
              endpoint,
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  print("HTTP status:", response.status)
                  print("SUCCESS: Supabase accepted the credentials.")

          except urllib.error.HTTPError as e:
              print("HTTP status:", e.code)

              body = e.read().decode(
                  "utf-8",
                  errors="replace",
              )

              # Supabase error response is safe to display;
              # never print URL/key themselves.
              print("Response:", body[:1000])
              raise SystemExit(
                  "FAIL: Supabase rejected the credentials."
              )

          except Exception as e:
              print(
                  "Connection error:",
                  type(e).__name__,
                  str(e),
              )
              raise
          PY

      - name: Test Python Supabase client
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          pip install -r python/requirements.txt

          python - <<'PY'
          import os
          import supabase
          from supabase import create_client

          url = os.environ["SUPABASE_URL"].strip()
          key = os.environ["SUPABASE_SECRET_KEY"].strip()

          print("=" * 60)
          print("PYTHON SUPABASE CLIENT TEST")
          print("=" * 60)

          print("Supabase package version:",
                getattr(supabase, "__version__", "unknown"))
          print("Key type:",
                "sb_secret" if key.startswith("sb_secret_")
                else "legacy")
          print("Key length:", len(key))

          try:
              client = create_client(url, key)
              print("SUCCESS: Python Supabase client created.")
          except Exception as e:
              print("FAILED:", type(e).__name__)
              print("Message:", str(e))
              raise
          PY

      - name: Test Python Supabase client
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          pip install -r python/requirements.txt

          python - <<'PY'
          import os
          import supabase
          from supabase import create_client

          url = os.environ["SUPABASE_URL"].strip()
          key = os.environ["SUPABASE_SECRET_KEY"].strip()

          print("=" * 60)
          print("PYTHON SUPABASE CLIENT TEST")
          print("=" * 60)

          print("Supabase package version:",
                getattr(supabase, "__version__", "unknown"))
          print("Key type:",
                "sb_secret" if key.startswith("sb_secret_")
                else "legacy")
          print("Key length:", len(key))

          try:
              client = create_client(url, key)
              print("SUCCESS: Python Supabase client created.")
          except Exception as e:
              print("FAILED:", type(e).__name__)
              print("Message:", str(e))
              raise
          PY

      - name: Test Supabase write read delete
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          pip install -r python/requirements.txt

          python - <<'PY'
          import os
          import uuid
          from supabase import create_client

          print("=" * 60)
          print("SUPABASE WRITE / READ / DELETE TEST")
          print("=" * 60)

          db = create_client(
              os.environ["SUPABASE_URL"].strip(),
              os.environ["SUPABASE_SECRET_KEY"].strip(),
          )

          test_service = (
              "github_connection_test_"
              + uuid.uuid4().hex
          )

          # -----------------------------------------------
          # INSERT
          # -----------------------------------------------

          inserted = (
              db.table("system_health")
              .insert({
                  "service": test_service,
                  "status": "TEST",
                  "message":
                      "Temporary GitHub Actions connection test",
                  "response_ms": 0,
              })
              .execute()
          )

          assert inserted.data, "INSERT returned no data"

          row = inserted.data[0]
          row_id = row["id"]

          print("INSERT: PASS")
          print("Temporary row ID:", row_id)

          # -----------------------------------------------
          # READ
          # -----------------------------------------------

          fetched = (
              db.table("system_health")
              .select("*")
              .eq("id", row_id)
              .execute()
          )

          assert len(fetched.data) == 1, (
              "READ did not return exactly one row"
          )

          assert (
              fetched.data[0]["service"]
              == test_service
          )

          print("READ: PASS")

          # -----------------------------------------------
          # DELETE
          # -----------------------------------------------

          db.table("system_health") \
              .delete() \
              .eq("id", row_id) \
              .execute()

          print("DELETE: PASS")

          # -----------------------------------------------
          # VERIFY DELETION
          # -----------------------------------------------

          verify = (
              db.table("system_health")
              .select("id")
              .eq("id", row_id)
              .execute()
          )

          assert len(verify.data) == 0, (
              "Temporary row still exists after DELETE"
          )

          print("DELETE VERIFICATION: PASS")

          print("=" * 60)
          print("SUCCESS: SUPABASE READ/WRITE ACCESS VERIFIED")
          print("Temporary test row removed.")
          print("NFL predictions table was NOT touched.")
          print("=" * 60)
          PY
