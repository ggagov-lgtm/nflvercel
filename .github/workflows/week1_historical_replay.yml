name: Generate Week 1 Historical Model Replay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/week1_historical_replay.yml"
  workflow_dispatch:

concurrency:
  group: nfl-week1-historical-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: python -m pip install -r python/requirements.txt
      - name: Check replay script syntax
        run: python -m compileall -q python/replay_historical.py
      - name: Forecast all sixteen Week 1 games with 2025-or-earlier training data
        env:
          PYTHONPATH: python
          HISTORICAL_REPLAY_WEEKS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
        run: python python/replay_historical.py
      - name: Validate generated predictions and data provenance
        run: |
          python - <<'PY'
          import json
          p="data/backtests/2026-week-1-model-replay.json"
          d=json.load(open(p,encoding="utf8"))
          assert d["kind"]=="historical_model_replay_not_original_pregame_predictions"
          assert d["season"]==2026 and d["week"]==1
          picks=d["predictions"]
          assert len(picks)==len({r["event_id"] for r in picks})==16
          for r in picks:
              assert r["reference_source"]=="week1_reconstructed_schedule_and_retrospective_odds"
              assert r["market"]["moneyline_source"]=="vegasinsider_postgame_reference_not_locked"
              cutoff=r["model"]["training_cutoff"]
              assert int(cutoff.split("-W")[0]) <= 2025,cutoff
              x=r["model"]
              assert 0<=x["home_win_prob"]<=1 and 0<=x["away_win_prob"]<=1
              assert abs(x["home_win_prob"]+x["away_win_prob"]+x["tie_prob"]-1)<0.00001
              assert 0<=x["over_prob"]<=1
          print("Valid historical Week 1 model replay: 16 games; cutoff prior to season; data source labeled.")
          PY
      - name: Commit Week 1 historical replay, not original picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtests/2026-week-1-model-replay.json
          if ! git diff --cached --quiet; then
            git commit -m "Save 2026 Week 1 model backtest with source provenance [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
