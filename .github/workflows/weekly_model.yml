name: NFL Weekly Model

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        required: true
        default: '2026'
      week:
        description: Week
        required: true
        default: '2'

  # Run three times during the Tuesday midnight hour in Chicago.
  # GitHub supports IANA timezones, so DST is handled by the scheduler.
  # Starting at :07 avoids the high-load top-of-hour window.
  schedule:
    - cron: '7,27,47 0 * * 2'
      timezone: "America/Chicago"

jobs:
  model:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Run weekly NFL model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then

            python python/weekly_run.py \
              --season "$INPUT_SEASON" \
              --week "$INPUT_WEEK"

          else

            python - <<'PY'
          import subprocess
          import requests

          url = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
          data = requests.get(url, timeout=20).json()
          season = int(data.get("season", {}).get("year"))
          current_week = int(data.get("week", {}).get("number"))

          # At Tuesday midnight ESPN can still identify the just-completed
          # Monday-night slate as the current week. Generate the NEXT week.
          target_week = current_week + 1

          # If ESPN has already rolled forward, avoid advancing twice by
          # checking whether the returned slate contains future games.
          events = data.get("events", [])
          if events:
              states = [
                  e.get("status", {}).get("type", {}).get("state")
                  for e in events
              ]
              if any(s == "pre" for s in states):
                  target_week = current_week

          print(f"ESPN reported: {season} Week {current_week}")
          print(f"Prediction target: {season} Week {target_week}")

          subprocess.check_call([
              "python", "python/weekly_run.py",
              "--season", str(season),
              "--week", str(target_week),
          ])
          PY

          fi
