name: NFL Weekly Model

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        required: true
        default: '2026'
      week:
        description: Week
        required: true
        default: '2'

  # Initial weekly run Tuesday shortly after midnight, then refresh
  # the current week once nightly. DST is handled by the IANA timezone.
  schedule:
    - cron: '7 0 * * *'
      timezone: "America/Chicago"

jobs:
  model:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Run weekly NFL model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then

            python python/weekly_run.py \
              --season "$INPUT_SEASON" \
              --week "$INPUT_WEEK"

          else

            python - <<'PY'
          import subprocess
          import requests

          url = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
          data = requests.get(url, timeout=20).json()
          season = int(data.get("season", {}).get("year"))
          current_week = int(data.get("week", {}).get("number"))

          events = data.get("events", [])
          states = [
              e.get("status", {}).get("type", {}).get("state")
              for e in events
          ]
          has_future_games = any(s == "pre" for s in states)

          from datetime import datetime
          from zoneinfo import ZoneInfo
          local_day = datetime.now(ZoneInfo("America/Chicago")).weekday()

          # Tuesday initializes the new slate. On every other day we keep
          # refreshing ESPN's current week while it still contains future
          # games. This avoids jumping to the next week after Thursday/Sunday
          # games have started.
          if local_day == 1:
              target_week = current_week if has_future_games else current_week + 1
              refresh = False
          else:
              target_week = current_week
              refresh = True

          print(f"ESPN reported: {season} Week {current_week}")
          print(f"Prediction target: {season} Week {target_week}")
          print(f"Refresh mode: {refresh}")

          cmd = [
              "python", "python/weekly_run.py",
              "--season", str(season),
              "--week", str(target_week),
          ]
          if refresh:
              cmd.append("--refresh")

          subprocess.check_call(cmd)
          PY

          fi
