name: NFL Week 2 Full Dry Run

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Run Week 2 production model - DRY RUN
        run: |
          echo "======================================================"
          echo "NFL QUANT MODEL - WEEK 2 DRY RUN"
          echo "NO SUPABASE WRITES WILL OCCUR"
          echo "======================================================"

          python --version

          python python/weekly_run.py \
            --season 2026 \
            --week 2 \
            --dry-run
