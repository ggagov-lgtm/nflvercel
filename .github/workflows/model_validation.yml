name: Verify NFL model
on:
  push:
    branches: [main]
    paths:
      - "python/src/production_model.py"
      - "python/src/recent_form.py"
      - "python/weekly_run.py"
      - "python/tests/**"
      - ".github/workflows/model_validation.yml"
  workflow_dispatch:
jobs:
  model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal model dependency
        run: python -m pip install "numpy>=1.26,<3"
      - name: Check Python syntax
        run: python -m compileall -q python/src/production_model.py python/src/recent_form.py python/weekly_run.py python/tests
      - name: Validate calibrated model and archived regression
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -v
