name: Test Atomic Prediction Save

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Test atomic prediction RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from supabase import create_client

          db = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SECRET_KEY"],
          )

          season = 2099
          week = 99
          now = datetime.now(timezone.utc).isoformat()

          # Clean up anything left by an interrupted prior test.
          db.table("predictions").delete().eq(
              "season", season
          ).eq(
              "week", week
          ).execute()

          rows = []

          for i in range(2):
              rows.append({
                  "season": season,
                  "week": week,
                  "event_id": f"ATOMIC_TEST_{i}",
                  "game": {
                      "test": True,
                      "game": i,
                  },
                  "market": {
                      "market_margin": 0,
                      "total": 40,
                  },
                  "model": {
                      "test": True,
                  },
                  "model_version": "atomic-test",
                  "prediction_run_at": now,
                  "locked_at": now,
              })

          try:
              result = db.rpc(
                  "save_weekly_predictions",
                  {
                      "p_season": season,
                      "p_week": week,
                      "p_expected_games": 2,
                      "p_predictions": rows,
                  },
              ).execute()

              print("RPC RESULT:", result.data)

              check = (
                  db.table("predictions")
                  .select("event_id")
                  .eq("season", season)
                  .eq("week", week)
                  .execute()
              )

              count = len(check.data or [])

              print("ROWS FOUND:", count)

              assert count == 2, (
                  f"Expected 2 rows, found {count}"
              )

              print("ATOMIC INSERT PASS")

              # ------------------------------------------------
              # Prove a bad batch does not partially write.
              # ------------------------------------------------

              bad_season = 2098

              db.table("predictions").delete().eq(
                  "season", bad_season
              ).eq(
                  "week", week
              ).execute()

              bad_rows = [
                  {
                      **rows[0],
                      "season": bad_season,
                      "event_id": "ROLLBACK_TEST_1",
                  },
                  {
                      **rows[1],
                      "season": bad_season,
                      # Duplicate event_id forces DB failure.
                      "event_id": "ROLLBACK_TEST_1",
                  },
              ]

              failed = False

              try:
                  db.rpc(
                      "save_weekly_predictions",
                      {
                          "p_season": bad_season,
                          "p_week": week,
                          "p_expected_games": 2,
                          "p_predictions": bad_rows,
                      },
                  ).execute()

              except Exception as e:
                  failed = True
                  print(
                      "EXPECTED FAILURE:",
                      str(e)[:500],
                  )

              assert failed, (
                  "Bad batch unexpectedly succeeded"
              )

              check_bad = (
                  db.table("predictions")
                  .select("event_id")
                  .eq("season", bad_season)
                  .eq("week", week)
                  .execute()
              )

              bad_count = len(
                  check_bad.data or []
              )

              print(
                  "ROWS AFTER FAILED BATCH:",
                  bad_count,
              )

              assert bad_count == 0, (
                  "Atomic rollback failed"
              )

              print("ROLLBACK PASS")
              print("ATOMIC RPC TEST PASS")

          finally:
              db.table("predictions").delete().eq(
                  "season", 2099
              ).eq(
                  "week", week
              ).execute()

              db.table("predictions").delete().eq(
                  "season", 2098
              ).eq(
                  "week", week
              ).execute()

              print("TEST DATA CLEANED UP")
          PY
